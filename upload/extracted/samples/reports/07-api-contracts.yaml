openapi: 3.1.0
info:
  title: Reconstructed sejda.com public upload and task contract
  version: 0.5.0
  description: |
    RECONSTRUCTED, NOT OFFICIAL. This document covers only operations that were
    observed in logged-out browser sessions on 2026-10-23/25, plus a small set
    of client-only references retained as unverified.

    Three logged-out free-tier windows exercised ten task types end to end with
    local fixtures:
      - splitByPages      -> four one-page PDFs in a ZIP
      - merge             -> one 8-page PDF
      - headerFooter      -> one 4-page PDF with Page 1..Page 4 headers
      - pdfToImage        -> four 150-dpi JPEGs in a ZIP
      - splitByBookmarks  -> three section PDFs (pages 1, 2-3 and 4)
      - alternateMix      -> one 8-page default-interleave PDF
      - encrypt           -> one 4-page AES-256 PDF
      - splitBySize       -> four one-page PDFs in a ZIP (1 KB target)
      - extractPages      -> one 3-page PDF containing source pages 1, 3 and 4
      - rotatePages       -> one 4-page PDF with page rotations 90, 0, 180, 270

    All ten followed the same public lifecycle:
      upload-check -> upload -> POST /api/tasks -> GET /api/tasks/{id}/change
      -> result page -> signed download.

    It is not the vendor's OpenAPI specification. Fields that were not visible
    in the capture are marked `x-reconstructed`. Operations that appear only
    as client references are kept under `x-unverified-client-references` and
    are not claimed as implemented. All 44 English tool pages are inventoried
    in `reports/coverage/tools.csv`, but only ten task-specific payloads were
    submitted.
  x-source:
    - reports/_raw/rea-upload-task-network.json
    - reports/_raw/rea-upload-task-network.sanitized.json
    - reports/_raw/merge-task-network.json
    - reports/_raw/header-footer-pdf-task-network.json
    - reports/_raw/pdf-to-jpg-task-network.json
    - reports/_raw/split-pdf-by-outline-task-network.sanitized.json
    - reports/_raw/alternate-mix-pdf-task-network.sanitized.json
    - reports/_raw/encrypt-pdf-task-network.sanitized.json
    - reports/_raw/followup-workflow-verification.json
    - reports/_raw/split-pdf-by-size-task-network.sanitized.json
    - reports/_raw/extract-pdf-pages-task-network.sanitized.json
    - reports/_raw/rotate-pdf-pages-task-network.sanitized.json
    - reports/_raw/phase4c-workflow-verification.json
    - reports/evidence/rea-bounded-pass.bundle.json
    - reports/evidence/workflow-pass-manifest.csv
    - reports/22-tool-matrix-and-workflows.md
    - reports/_raw/sejda-js/shared.js
    - reports/_raw/sejda-js/split.js
    - site-re/sites/sejda-com/raw/upload-probe.json
    - site-re/sites/sejda-com/raw/backend-probe.json
