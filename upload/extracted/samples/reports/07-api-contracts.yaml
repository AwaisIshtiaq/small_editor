servers:
  - url: https://www.sejda.com
    description: Public origin observed behind Cloudflare

tags:
  - name: files
    description: File upload operations observed in a logged-out session
  - name: tasks
    description: Asynchronous task submission, status polling and result download
  - name: analytics
    description: First-party analytics endpoint observed during page activity

paths:
  /api/files/upload-check:
    post:
      tags: [files]
      summary: Pre-upload check
      description: |
        Observed as a same-origin POST after selecting `sample.pdf`. The request
        body was `uplid=<value>` (form-urlencoded) and the response body was
        exactly `{"status":"ok"}`.
      operationId: uploadCheck
      security: []
      x-status: observed
      x-evidence: art_338ccde339635828e237193dac4ee524010ece3ff5e25cb27427a8f56381facf
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [uplid]
              properties:
                uplid:
                  type: string
                  description: Upload correlation id generated for the page/task session.
      responses:
        "200":
          description: Check accepted
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
              example:
                status: ok
          headers:
            Server:
              schema: { type: string }
              description: Observed `cloudflare`
            X-Firefox-Translate:
              schema: { type: string }
              description: Observed `disable`
            X-Frame-Options:
              schema: { type: string }
              description: Observed `SAMEORIGIN`
            Cache-Control:
              schema: { type: string }
              description: Observed `no-cache, private, no-store, no-transform`
            Access-Control-Allow-Origin:
              schema: { type: string }
              description: Observed `https://www.sejda.com`
            Access-Control-Allow-Credentials:
              schema: { type: string }
              description: Observed `true`
            Vary:
              schema: { type: string }
              description: Observed `Origin`
        default:
          description: Not exercised; error schema unknown
          x-status: unknown

  /api/files/upload:
    post:
      tags: [files]
      summary: Upload a PDF
      description: |
        Observed as a same-origin multipart POST after `upload-check`. The
        browser sent `X-FileLocalId`, `Content-Disposition: attachment;
        filename="sample.pdf"` and a multipart body. The response was
        `{"id":"<uuid>-<server-suffix>_<counter>"}`.

        Chrome DevTools Protocol did not expose the multipart request bytes in
        this capture, so the exact field order and all optional fields are not
        modelled.
      operationId: uploadFile
      security: []
      x-status: observed
      x-evidence: art_338ccde339635828e237193dac4ee524010ece3ff5e25cb27427a8f56381facf
      parameters:
        - name: _s
          in: query
          required: false
          schema: { type: string }
          description: Observed empty in the 2026-10-25 capture; semantics unknown.
        - name: uplid
          in: query
          required: false
          schema: { type: string }
          description: Observed upload correlation id; matches the preceding check.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The selected PDF. Field name observed in the page form.
                uplid:
                  type: string
                  description: Hidden form field observed in the page form.
              x-reconstructed: true
              x-note: "The form is `#fileUploadForm`; the body bytes were not retained by CDP."
      responses:
        "200":
          description: Upload accepted
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                    description: Observed as `<uuid>-<server-suffix>_<counter>`; semantics unknown.
                    examples:
                      - "<file-id>"
          headers:
            Server:
              schema: { type: string }
              description: Observed `cloudflare`
            X-Firefox-Translate:
              schema: { type: string }
              description: Observed `disable`
            X-Frame-Options:
              schema: { type: string }
              description: Observed `SAMEORIGIN`
            Cache-Control:
              schema: { type: string }
              description: Observed `no-cache, private, no-store, no-transform`
            Access-Control-Allow-Origin:
              schema: { type: string }
              description: Observed `https://www.sejda.com`
            Access-Control-Allow-Credentials:
              schema: { type: string }
              description: Observed `true`
        default:
          description: Not exercised; error schema unknown
          x-status: unknown

  /api/tasks:
    post:
      tags: [tasks]
      summary: Submit a PDF task
      description: |
        Observed for ten logged-out task types: `splitByPages` (split-pdf),
        `merge` (merge-pdf), `headerFooter` (header-footer-pdf),
        `pdfToImage` (pdf-to-jpg), `splitByBookmarks` (split-pdf-by-outline),
        `alternateMix` (alternate-mix-pdf), `encrypt` (encrypt-pdf),
        `splitBySize` (split-pdf-by-size), `extractPages` (extract-pdf-pages)
        and `rotatePages` (rotate-pdf-pages). The request was JSON and the
        response was a bare JSON string containing the task id.

        The task type is a client-supplied value; it does not establish the
        server implementation or the SDK mapping. The common fields below are
        observed across the ten payloads; type-specific fields are marked by
        their observed task type. The latest three payloads all reported
        `cvts: "0.14"`, `pdfjs: "bebd506c3"`, `libsCache: "654"`,
        `consoleLogs: []` and `www: "www61.sejda.com"`.
      operationId: submitTask
      security: []
      x-status: observed
      x-evidence: art_338ccde339635828e237193dac4ee524010ece3ff5e25cb27427a8f56381facf ; art_8a5e872ee8fc7ac4443aff4780b055cc33d7b5486223dd31cd23b8051d9feac5 ; art_166ad931e10f6ba1d5ac4669bf7b37e4b535ed998757ace8f430d9ad8bc057a5 ; art_be53344e70412288459c1570555737b77476e436495f8b14adcf90af1e8081ee ; art_ae0da5348e808277f0098e2ee023ab3b11b5aa51156b5d5b90b49423a5988fcb ; art_1ac56e2979c6ba0722a04eb7fb1300489faf8599d9231ad2a636e4d64240f151 ; art_952572508c7a3d34c65af9e235911b1e638293641c12f08fac3204a162eb5578 ; art_d6f71089f79030b74e8949201386ee497d9230365280a342826ea0f8e75859e7 ; art_0daba153706d5245cf028e0165e3c65c73b183c41707ae0e36d44170314e0c5c ; art_1ff1dfcc42ca2fe007a0f465b133f248b3b562de857a72d1410a1e0fea47d561
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, files, uri]
              properties:
                type:
                  type: string
                  enum: [splitByPages, merge, headerFooter, pdfToImage, splitByBookmarks, alternateMix, encrypt, splitBySize, extractPages, rotatePages]
                  description: Client task type; ten values were submitted end to end.
                step:
                  oneOf:
                    - type: string
                    - type: array
                      items: { type: string }
                  description: Split step as `"1"` for splitByPages; alternateMix serialized a three-slot array `["1","1","1"]`.
                pages:
                  type: string
                  description: Page selection; observed `"all"` for splitByPages, `""` for headerFooter/pdfToImage, and `"1,3-4"` for extractPages.
                size:
                  type: number
                  description: splitBySize only; observed numeric `1` with `sizeUnit: KB`.
                sizeUnit:
                  type: string
                  enum: [MB, KB]
                  description: splitBySize only; observed `KB`.
                pageRotationsPerSource:
                  type: array
                  items: { type: string }
                  description: rotatePages only; observed `["0:1:90","0:3:180","0:4:270"]`, where each entry is `fileIndex:pageNumber:rotation`.
                bookmarksLevel:
                  type: string
                  description: Split-by-bookmarks outline level; observed `"1"`.
                bookmarksExpression:
                  type: string
                  description: Split-by-bookmarks title filter (contains); observed `"Chapter"`.
                includePageAfter:
                  type: boolean
                  description: Split-by-bookmarks extra end page; absent/false in the observed payload.
                reverse:
                  type: array
                  items: { type: string }
                  description: AlternateMix reverse flags; observed `["false","false","false"]`.
                repeat:
                  type: array
                  items: { type: boolean }
                  description: AlternateMix repeat flags; observed `[false,false,false]`.
                userPassword:
                  type: string
                  format: password
                  description: Encrypt only; observed synthetic test value, redacted here.
                ownerPassword:
                  type: string
                  format: password
                  description: Encrypt only; observed synthetic test value, redacted here.
                encryptionAlgorithm:
                  type: string
                  enum: [aes_256, aes_128, rc4_128]
                  description: Encrypt only; only `aes_256` was observed.
                permissions:
                  type: array
                  items: { type: string }
                  description: Encrypt only; absent when no permission boxes were selected.
                outputFilenamePattern:
                  type: string
                  description: Observed `[BASENAME]-[CURRENTPAGE]` for splitByPages and pdfToImage, `[BASENAME]` for extractPages, and empty for headerFooter/rotatePages.
                outputFilename:
                  type: string
                  description: Merge only; observed empty string.
                mode:
                  type: string
                  description: Merge only; observed `file`.
                acroFormPolicy:
                  type: string
                  description: Merge only; observed `merge_renaming`.
                images:
                  type: array
                  items: { type: string }
                  description: Merge only; observed empty array.
                rotations:
                  type: array
                  items: { type: integer }
                  description: Merge only; observed `[0, 0]` for two files.
                pattern:
                  type: string
                  description: Header/footer only; observed `Page [PAGE_ARABIC]`.
                hf-format-customize:
                  type: array
                  items: { type: string }
                  description: Header/footer token array; observed 10 entries using PAGE_ARABIC, PAGE_ROMAN, TOTAL_PAGES_ARABIC and BASE_NAME.
                pageLocation:
                  type: string
                  enum: [top-left, top-center, top-right, bottom-left, bottom-center, bottom-right]
                  description: Header/footer placement; observed `top-center`.
                font:
                  type: string
                  enum: [times_roman, helvetica, courier]
                  description: Header/footer font; observed `times_roman`.
                fontSize:
                  type: integer
                  description: Header/footer font size; observed 10.
                color:
                  type: string
                  description: Header/footer color; observed `#000000`.
                addMargins:
                  type: boolean
                  description: Header/footer margin option; observed false.
                pageCountStartFrom:
                  type: string
                  description: Header/footer page counter start; observed empty.
                allPages:
                  type: boolean
                  description: PDF-to-image only; observed true when no thumbnail was selected.
                resolution:
                  type: integer
                  enum: [75, 150, 220]
                  description: PDF-to-image DPI; observed 150.
                imageFormat:
                  type: string
                  enum: [jpg, png, tiff]
                  description: PDF-to-image format; observed jpg.
                tiffSingleFileWithAllPages:
                  type: boolean
                  description: TIFF-only option from the page form; not exercised.
                imageColorType:
                  type: string
                  enum: [rgb, grayscale, black_white]
                  description: TIFF-only color option from the page form; not exercised.
                files:
                  type: array
                  items:
                    type: [string, "null"]
                  description: File ids returned by the upload endpoint; alternateMix observed a third null slot.
                uri:
                  type: string
                  description: Originating public route; observed `/split-pdf`, `/merge-pdf`, `/header-footer-pdf`, `/pdf-to-jpg`, `/split-pdf-by-outline`, `/alternate-mix-pdf`, `/encrypt-pdf`, `/split-pdf-by-size`, `/extract-pdf-pages`, `/rotate-pdf-pages`.
                specificResultFilenames:
                  type: array
                  items: { type: string }
                  description: Split only; observed four empty strings.
                userAgent:
                  type: string
                  description: Browser user agent.
                cvts:
                  type: string
                  description: Client build/version marker; observed `0.10`, `3.96`, `0.95`, `1.59` and `0.14`.
                pdfjs:
                  type: string
                  description: pdf.js build marker; observed `bebd506c3`.
                libsCache:
                  type: string
                  description: Shared-bundle cache key; observed `654`.
                consoleLogs:
                  type: array
                  items: { type: string }
                  description: Client console lines; observed `["Setting splitStep 1"]` for split and empty arrays otherwise.
                traceId:
                  type: string
                  description: Client trace id; observed `tr-<id>` and varied per task.
                www:
                  type: string
                  description: Origin/worker host marker; observed `www18`, `www22`, `www23`, `www36` and `www61`; selection mechanism unknown.
              example:
                type: splitByPages
                step: "1"
                pages: all
                outputFilenamePattern: "[BASENAME]-[CURRENTPAGE]"
                files: ["<file-id>"]
                uri: /split-pdf
                specificResultFilenames: ["", "", "", ""]
                userAgent: "<browser UA>"
                cvts: "0.10"
                pdfjs: bebd506c3
                libsCache: "654"
                consoleLogs: ["Setting splitStep 1"]
                traceId: tr-<id>
                www: www23.sejda.com
      responses:
        "200":
          description: Task accepted; body is a JSON string task id
          content:
            application/json:
              schema:
                type: string
                examples: ["<task-id>"]
          headers:
            X-RateLimit-Remaining:
              schema: { type: string }
              description: Observed `2`, `1`, `0` in each of three logged-out free-tier windows.
            X-RateLimit-Wait:
              schema: { type: string }
              description: Observed `3599`, `3260`, `3140` in window one; `3599`, `3483`, `3443` in window two; and `3599`, `3498`, `3479` in window three. The value is seconds until the free quota resets.
            Server:
              schema: { type: string }
              description: Observed `cloudflare`
            X-Firefox-Translate:
              schema: { type: string }
              description: Observed `disable`
            X-Frame-Options:
              schema: { type: string }
              description: Observed `SAMEORIGIN`
            Cache-Control:
              schema: { type: string }
              description: Observed `no-cache, private, no-store, no-transform`
        "402":
          description: Client code handles a quota/paywall response; not exercised
          x-status: unverified
        "429":
          description: Client code handles a rate-limit response; not exercised
          x-status: unverified
        "430":
          description: Client code shows a captcha challenge; not exercised
          x-status: unverified
        default:
          description: Error schema unknown
          x-status: unknown

  /api/tasks/{id}/change:
    get:
      tags: [tasks]
      summary: Poll task status and result
      description: |
        Observed immediately after task submission for all ten exercised task
        types. Every response reported `status: "Completed"` and result
        metadata. Other statuses were not observed. The query parameter `_` is
        a cache-buster.

        `resultFullUrlPattern` contains the placeholder `%7B%7Bfilename%7D%7D`
        (URL-encoded `{{filename}}`). Substituting `resultFilename` produced the
        multi-file ZIP; the unresolved template returned `text/html` for that
        ZIP. See the observed task payloads below.
      operationId: getTaskChange
      security: []
      x-status: observed
      x-evidence: art_338ccde339635828e237193dac4ee524010ece3ff5e25cb27427a8f56381facf ; art_8a5e872ee8fc7ac4443aff4780b055cc33d7b5486223dd31cd23b8051d9feac5 ; art_166ad931e10f6ba1d5ac4669bf7b37e4b535ed998757ace8f430d9ad8bc057a5 ; art_be53344e70412288459c1570555737b77476e436495f8b14adcf90af1e8081ee ; art_ae0da5348e808277f0098e2ee023ab3b11b5aa51156b5d5b90b49423a5988fcb ; art_1ac56e2979c6ba0722a04eb7fb1300489faf8599d9231ad2a636e4d64240f151 ; art_952572508c7a3d34c65af9e235911b1e638293641c12f08fac3204a162eb5578 ; art_d6f71089f79030b74e8949201386ee497d9230365280a342826ea0f8e75859e7 ; art_0daba153706d5245cf028e0165e3c65c73b183c41707ae0e36d44170314e0c5c ; art_1ff1dfcc42ca2fe007a0f465b133f248b3b562de857a72d1410a1e0fea47d561
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: _
          in: query
          required: false
          schema: { type: string }
          description: Cache-buster observed as a millisecond timestamp.
      responses:
        "200":
          description: Task status/result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Observed `Completed`; other values unknown.
                  type:
                    type: string
                    enum: [splitByPages, merge, headerFooter, pdfToImage, splitByBookmarks, alternateMix, encrypt, splitBySize, extractPages, rotatePages]
                    description: Task type echoed in the result metadata.
                  resultFilename:
                    type: string
                    description: Observed `sejda-<suffix>.zip` for multi-file results, `sample.pdf` / `sample-merge-b_merged.pdf` for single-file results, `sample_mixed.pdf` for alternateMix, and `sample.pdf` for encrypt, extractPages and rotatePages.
                  resultFileSize:
                    type: integer
                    description: Metadata size; observed 6896, 5344, 4256, 502800, 6096, 5296, 4048, 10176, 2736 and 3248. Downloads were 6881, 5342, 4251, 502792, 6083, 5285, 4046, 10161, 2722 and 3238 bytes respectively; the 2–15 byte delta is unexplained.
                  resultFullUrlPattern:
                    type: string
                    description: Signed download URL pattern with URL-encoded `%7B%7Bfilename%7D%7D`; token redacted here.
                  warnings:
                    type: array
                    items: { type: string }
                  resultItems:
                    type: array
                    items: { type: string }
                    description: Observed four PDF names, one merged PDF, one header/footer PDF, four JPG names, three bookmark-section PDF names, one alternateMix PDF, one encrypted PDF, four size-split PDF names, one extracted PDF, or one rotated PDF. The splitBySize ZIP central directory listed entries in order 4,1,2,3 while resultItems was 1,2,3,4; the reason is unknown.
                  id:
                    type: string
                    description: Task id.
              example:
                status: Completed
                type: pdfToImage
                resultFilename: sejda-<suffix>.zip
                resultFileSize: 502800
                resultFullUrlPattern: "www.sejda.com/api/tasks/<task-id>/download/%7B%7Bfilename%7D%7D?s=<redacted>&d=true&_s=<redacted>"
                warnings: []
                resultItems: ["sample-1.jpg", "sample-2.jpg", "sample-3.jpg", "sample-4.jpg"]
                id: "<task-id>"
          headers:
            Server:
              schema: { type: string }
              description: Observed `cloudflare`
            X-Firefox-Translate:
              schema: { type: string }
              description: Observed `disable`
            X-Frame-Options:
              schema: { type: string }
              description: Observed `SAMEORIGIN`
            Cache-Control:
              schema: { type: string }
              description: Observed `no-cache, private, no-store, no-transform`
        default:
          description: Error schema unknown
          x-status: unknown

  /api/tasks/{id}/download/{filename}:
    get:
      tags: [tasks]
      summary: Download a task result
      description: |
        The task-status response supplied a signed download pattern. The
        observed pattern contains `%7B%7Bfilename%7D%7D`, so the client must
        substitute the encoded `resultFilename`. With that substitution:
          - splitByPages: `application/zip`, 6,881 bytes, four PDFs
          - merge: `application/pdf`, 5,342 bytes, eight pages
          - headerFooter: `application/pdf`, 4,251 bytes, four pages
          - pdfToImage: `application/zip`, 502,792 bytes, four JPEGs
          - splitByBookmarks: `application/zip`, 6,083 bytes, three PDFs
          - alternateMix: `application/pdf`, 5,285 bytes, eight pages
          - encrypt: `application/pdf`, 4,046 bytes, four AES-256 pages
          - splitBySize: `application/zip`, 10,161 bytes, four one-page PDFs
          - extractPages: `application/pdf`, 2,722 bytes, three pages (1, 3, 4)
          - rotatePages: `application/pdf`, 3,238 bytes, four pages (90, 0, 180, 270)

        Without substitution, the multi-file PDF-to-JPG request returned
        `text/html` (289,508 bytes); the two single-file PDF requests still
        returned PDF. The reason for that difference is unknown.
        The signature is a short-lived capability and is redacted here.
      operationId: downloadTaskResult
      security: []
      x-status: observed
      x-evidence: art_16a2bc53fc48fe3e17a7130fe1668beb3cf0517ad7dce834383f7688a9760180 ; art_ae0da5348e808277f0098e2ee023ab3b11b5aa51156b5d5b90b49423a5988fcb ; art_1ac56e2979c6ba0722a04eb7fb1300489faf8599d9231ad2a636e4d64240f151 ; art_952572508c7a3d34c65af9e235911b1e638293641c12f08fac3204a162eb5578 ; art_4f79fc6798a74fcb25b33cf3f8746c1fcff4015d82d9e4428fa71adb435332c0 ; art_b266f71e31c93672c5a149d935713756dfc6da409e09d981ed67b7e629cf84c2 ; art_ecff97257550aaecef85838e6794cce687a1ecc387211cafd3a6f6a88f0738f7
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: filename
          in: path
          required: true
          schema: { type: string }
        - name: s
          in: query
