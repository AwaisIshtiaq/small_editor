<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Small Editor — PDF find &amp; tool search</title>
    <meta
      name="description"
      content="A small, local-first PDF editor with Sejda-style tool search and in-document find."
    />
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body>
    <a class="skip-link" href="#pages">Skip to document</a>

    <div class="app">
      <header class="topbar">
        <div class="brand" aria-label="Small Editor">
          <span class="brand-mark" aria-hidden="true">S</span>
          <span class="brand-name">Small Editor</span>
        </div>

        <button
          id="toolsBtn"
          class="btn ghost tools-btn"
          aria-haspopup="dialog"
          aria-expanded="false"
          aria-controls="palette"
        >
          All tools
          <kbd>Ctrl K</kbd>
        </button>

        <div class="docbar">
          <span id="docName" class="doc-name">No document</span>
          <span id="docMeta" class="doc-meta"></span>
        </div>

        <div class="grow"></div>

        <button id="findBtn" class="btn ghost" aria-keyshortcuts="Control+F">
          Find
          <kbd>Ctrl F</kbd>
        </button>
        <button id="openBtn" class="btn primary">Open PDF</button>
        <input id="fileInput" type="file" accept="application/pdf,.pdf" hidden />
      </header>

      <main class="stage">
        <section id="dropzone" class="dropzone" aria-label="Open a PDF">
          <div class="dropzone-inner">
            <div class="drop-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M14 3v5h5" />
                <path d="M19 8v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7z" />
                <path d="M9 13h6M9 17h4" />
              </svg>
            </div>
            <h1>Open a PDF to start</h1>
            <p>
              Drop a file here, or
              <button id="dropOpenBtn" class="linklike">browse your computer</button>.
              Files never leave this browser tab.
            </p>
            <div class="drop-actions">
              <button id="sampleBtn" class="btn">Try the sample PDF</button>
            </div>
            <p class="privacy-note">
              <span class="dot" aria-hidden="true"></span>
              Local only · no upload · no account
            </p>
          </div>
        </section>

        <div id="viewer" class="viewer" hidden>
          <div id="pages" class="pages" tabindex="-1"></div>
        </div>
      </main>

      <div id="findBar" class="findbar" role="search" hidden>
        <div class="findbar-main">
          <span class="find-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.2-3.2" />
            </svg>
          </span>
          <input
            id="findInput"
            type="search"
            placeholder="Find in document"
            autocomplete="off"
            spellcheck="false"
            aria-label="Find in document"
          />
          <span id="findCount" class="find-count" aria-live="polite">Open a PDF</span>
          <div class="find-nav">
            <button id="prevBtn" class="icon-btn" title="Previous match (Shift+Enter)" aria-label="Previous match">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m6 15 6-6 6 6" />
              </svg>
            </button>
            <button id="nextBtn" class="icon-btn" title="Next match (Enter)" aria-label="Next match">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m6 9 6 6 6-6" />
              </svg>
            </button>
          </div>
          <div class="find-toggles">
            <button id="caseBtn" class="toggle-btn" aria-pressed="false" title="Match case">
              Aa
            </button>
            <button id="wordBtn" class="toggle-btn" aria-pressed="false" title="Whole word">
              ab<span class="bar">|</span>
            </button>
          </div>
          <button id="closeFind" class="icon-btn" title="Close (Esc)" aria-label="Close find bar">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M6 6l12 12M18 6 6 18" />
            </svg>
          </button>
        </div>
        <div id="findMeta" class="findbar-meta"></div>
      </div>

      <div id="palette" class="palette" hidden>
        <div class="palette-backdrop" data-palette-close></div>
        <div class="palette-panel" role="dialog" aria-modal="true" aria-labelledby="paletteTitle">
          <h2 id="paletteTitle" class="sr-only">All tools</h2>
          <div class="palette-searchrow">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.2-3.2" />
            </svg>
            <input
              id="toolSearch"
              type="search"
              placeholder="Type to search"
              autocomplete="off"
              spellcheck="false"
              aria-label="Search tools"
            />
            <button id="toolSearchClear" class="icon-btn small" hidden aria-label="Clear search">✕</button>
            <kbd>Esc</kbd>
          </div>

          <div class="palette-scroll">
            <section class="palette-section" aria-labelledby="recentHeading">
              <h3 id="recentHeading" class="palette-heading">Recent</h3>
              <div id="recentStrip" class="recent-strip"></div>
            </section>
            <div id="paletteBody" class="palette-body"></div>
          </div>

          <footer class="palette-foot">
            <span><kbd>Enter</kbd> open first result</span>
            <span class="foot-sep" aria-hidden="true">·</span>
            <button id="suggestBtn" class="linklike subtle">Suggest a missing feature</button>
          </footer>
        </div>
      </div>

      <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

      <dialog id="infoDialog" class="info-dialog">
        <form method="dialog" class="info-form">
          <header class="info-head">
            <h2 id="infoTitle">About</h2>
            <button class="icon-btn" value="close" aria-label="Close">✕</button>
          </header>
          <div id="infoBody" class="info-body"></div>
        </form>
      </dialog>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
